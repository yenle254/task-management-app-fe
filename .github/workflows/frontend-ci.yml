name: Frontend CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TZ: Asia/Ho_Chi_Minh
    defaults:
      run:
        # A failed command must remain failed even when output is piped to tee.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: |
          mkdir -p report/logs
          npm ci --ignore-scripts --no-audit --no-fund 2>&1 | tee report/logs/ci-install.log

      - name: Run Frontend Tests (node --test)
        run: npm run test:ci 2>&1 | tee report/logs/ci-test.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: report/logs/ci-*.log
          if-no-files-found: warn
          retention-days: 14

